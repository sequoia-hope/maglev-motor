# The amzhex 1/4" board in pcbview (~/Software/pcbview): copper layer by layer,
# the 3D model, and the part pane, as a static site the simulator links out to
# ("Pcbview", beside "Board report") and GitHub Pages serves as-is.
#
#     ~/Software/pcbview/bin/pcbview build route/pcbview.toml   ->  route/pcbview/
#
# There is no schematic: the board is generated by the pipeline in this
# directory (see README.md), so only the PCB, 3D and Overview tabs exist.

title = "amzhex — the routed 1/4\" honeycomb stator"
subtitle = "maglev-motor"
out = "pcbview"
back = { href = "../../", label = "Simulator" }
repo = "https://github.com/sequoia-hope/maglev-motor"

[[boards]]
id = "amzhex-full"
name = "amzhex-full — routed end to end"
pcb = "out/amzhex-full.kicad_pcb"
note = "The 12 × 14 hex coil board, 168 coils with an H-bridge each, on 14 copper layers: twelve of winding and two (In12, B.Cu) of electronics. The torus-routed stamp is tiled on the 20 interior quads and the 22 rim quads are routed in place; KiCad DRC 0, 0 unconnected, 168/168 coil leads correct, measured on this file (see route/report/)."
front = "Top (winding)"
back = "Bottom (electronics)"
front_note = "F.Cu is one of the twelve winding layers: 168 hexagonal 12-turn spirals."
back_note = "Every part is here: 168 TC118S bridges, 168 decoupling caps, 42 74HC595 registers, the 2 × 5 header and the /OE dead-man."

[layers.notes]
"In12.Cu" = "The second electronics layer: the fixed east–west bus lanes and the shift chain's reserved return lines."
"B.Cu" = "The electronics layer: parts, the bus ladders and the register-to-bridge routing; also a GND pour in the gutters."
