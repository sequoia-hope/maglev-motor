<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Planar Maglev Motor Simulator</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="mark"></span>
    <h1>Planar Maglev Simulator</h1>
    <span class="sub">Halbach translator over a coil stator &middot; harmonic field model, 6-DOF Lorentz coupling</span>
  </div>
  <nav class="tabs" id="tabs">
    <button data-tab="design" class="active">Design</button>
    <button data-tab="optimise">Optimise</button>
    <button data-tab="build">Build</button>
    <button data-tab="simulate">Simulate</button>
    <button data-tab="about">Notes &amp; sources</button>
  </nav>
  <button id="themeToggle" class="ghost" title="Toggle light / dark">◐</button>
</header>

<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="preset-row">
      <label>Preset</label>
      <select id="presetSelect"></select>
    </div>
    <div id="params"></div>
    <div class="sidebar-foot">
      <button id="btnReset" class="ghost wide">Reset to preset</button>
      <div class="selftest" id="selfTest"></div>
    </div>
  </aside>

  <main class="content">
    <!-- ============================ DESIGN ============================ -->
    <section class="tabpane active" id="pane-design">
      <div class="tiles" id="tiles"></div>

      <div class="grid2">
        <figure class="card tall">
          <figcaption>Machine view <span class="hint">drag to orbit &middot; scroll to zoom</span>
            <span class="viewctl">
              <select id="secAxis" class="inline" title="Section cut">
                <option value="none">no cut</option>
                <option value="x">cut along x</option>
                <option value="y">cut along y</option>
              </select>
              <input type="range" id="secFrac" min="0" max="1" step="0.02" value="0.5" title="Cut position">
              <label title="Exaggerate the vertical axis so thin layers and the air gap are visible">z&times;
                <input type="range" id="zScale" min="1" max="12" step="0.5" value="1">
                <output id="zScaleOut">1</output>
              </label>
            </span>
          </figcaption>
          <canvas id="designView"></canvas>
        </figure>
        <figure class="card tall">
          <figcaption>Air-gap field under the translator
            <select id="fieldComponent" class="inline">
              <option value="bz">B&#8203;z (vertical)</option>
              <option value="mag">|B| (magnitude)</option>
            </select>
          </figcaption>
          <canvas id="fieldMap"></canvas>
        </figure>
      </div>

      <div class="grid2">
        <figure class="card">
          <figcaption>Lift capability vs air gap <span class="hint">the exp(&minus;kz) wall</span></figcaption>
          <canvas id="gapChart"></canvas>
        </figure>
        <figure class="card">
          <figcaption>Hover power vs air gap</figcaption>
          <canvas id="gapPower"></canvas>
        </figure>
      </div>

      <div class="grid2">
        <figure class="card">
          <figcaption>Capability across the stator
            <select id="mapMetric" class="inline">
              <option value="lift">Lift margin (&times; weight)</option>
              <option value="sigmaMin">&sigma;&#8203;min (worst-direction N/A)</option>
              <option value="power">Hover power (W)</option>
              <option value="cond">Condition number</option>
            </select>
          </figcaption>
          <canvas id="capMap"></canvas>
        </figure>
        <figure class="card">
          <figcaption>Force ripple along x <span class="hint">at constant hover command</span></figcaption>
          <canvas id="rippleChart"></canvas>
        </figure>
      </div>

      <figure class="card">
        <figcaption>Pole-pitch sweep <span class="hint">rebuilds the whole machine at each pitch &middot; coil pitch tracks pole pitch unless locked</span>
          <button id="btnPitchSweep" class="ghost small">Run sweep</button>
          <button id="btnPitchApply" class="ghost small" disabled>Apply best</button>
        </figcaption>
        <canvas id="pitchChart"></canvas>
      </figure>

      <div class="grid2">
        <div class="card" id="stackCard"></div>
        <div class="card" id="gapCard"></div>
      </div>

      <div class="card" id="designTable"></div>
    </section>

    <!-- =========================== OPTIMISE =========================== -->
    <section class="tabpane" id="pane-optimise">
      <div class="card">
        <div class="optbar">
          <label class="inline-field">Maximise / minimise
            <select id="optObjective"></select>
          </label>
          <label class="inline-field">Budget
            <input type="range" id="optBudget" min="100" max="2000" step="50" value="500">
            <output id="optBudgetOut"></output>
          </label>
          <button id="btnOptRun" class="primary">Run search</button>
          <button id="btnOptStop" class="ghost" disabled>Stop</button>
          <span class="flex"></span>
          <span class="status" id="optStatus">idle</span>
        </div>
        <div class="optprogress"><div id="optBar"></div></div>
        <div class="optgrid">
          <div>
            <h4>Search these dimensions</h4>
            <div id="optDims"></div>
          </div>
          <div>
            <h4>Hard constraints</h4>
            <div id="optConstraints"></div>
          </div>
        </div>
      </div>

      <div id="optBest"></div>

      <div class="grid2">
        <figure class="card">
          <figcaption>Design space <span class="hint">click a point to load it</span>
            <select id="optScatterX" class="inline"></select>
            <select id="optScatterY" class="inline"></select>
          </figcaption>
          <canvas id="optScatter"></canvas>
        </figure>
        <figure class="card">
          <figcaption>Objective vs each dimension <span class="hint">feasible designs only</span>
            <select id="optSliceDim" class="inline"></select>
          </figcaption>
          <canvas id="optSlice"></canvas>
        </figure>
      </div>

      <div class="card" id="optTable"></div>
    </section>

    <!-- ============================= BUILD ============================ -->
    <section class="tabpane" id="pane-build">
      <figure class="card tall">
        <figcaption>Exploded assembly <span class="hint">drag to orbit &middot; scroll to zoom</span>
          <span class="viewctl">
            <label title="Separate the parts along the assembly axis. A viewing transform only — thicknesses and the air gap stay at true scale.">explode
              <input type="range" id="explodeAmt" min="0" max="2" step="0.05" value="1">
              <output id="explodeOut">1.0</output>
            </label>
            <label title="Exaggerate the vertical axis so thin layers are visible">z&times;
              <input type="range" id="zScaleExp" min="1" max="12" step="0.5" value="1">
              <output id="zScaleExpOut">1</output>
            </label>
          </span>
        </figcaption>
        <canvas id="explodedView"></canvas>
      </figure>

      <div class="card" id="bomCard"></div>

      <div class="grid2">
        <div class="card" id="magnetOrderCard"></div>
        <div class="card" id="notModelledCard"></div>
      </div>
    </section>

    <!-- =========================== SIMULATE =========================== -->
    <section class="tabpane" id="pane-simulate">
      <div class="simbar">
        <button id="btnPlay" class="primary">Pause</button>
        <button id="btnResetSim" class="ghost">Reset</button>
        <button id="btnKick" class="ghost">Kick it</button>
        <label class="inline-field">Trajectory
          <select id="trajSelect"></select>
        </label>
        <label class="inline-field">Speed
          <input type="range" id="trajSpeed" min="0.1" max="12" step="0.1" value="2">
          <output id="trajSpeedOut"></output>
        </label>
        <label class="inline-field">Amplitude
          <input type="range" id="trajAmp" min="1" max="80" step="1" value="25">
          <output id="trajAmpOut"></output>
        </label>
        <label class="inline-field">Noise
          <input type="range" id="noiseSlider" min="0" max="0.2" step="0.005" value="0">
          <output id="noiseOut"></output>
        </label>
        <span class="flex"></span>
        <span class="status" id="simStatus"></span>
        <button id="btnUseMeasured" class="ghost" title="Feed the measured 3-sigma tracking error into the air-gap tolerance budget">Use measured error</button>
      </div>

      <div class="grid-sim">
        <figure class="card view">
          <figcaption>Live view
            <span class="viewctl">
              <select id="secAxisSim" class="inline">
                <option value="none">no cut</option>
                <option value="x">cut along x</option>
                <option value="y">cut along y</option>
              </select>
              <label>z&times;
                <input type="range" id="zScaleSim" min="1" max="12" step="0.5" value="1">
                <output id="zScaleSimOut">1</output>
              </label>
            </span>
          </figcaption>
          <canvas id="simView"></canvas>
        </figure>
        <div class="sim-side">
          <div class="tiles compact" id="simTiles"></div>
          <figure class="card short">
            <figcaption>Coil currents</figcaption>
            <canvas id="currentStrip"></canvas>
          </figure>
        </div>
      </div>

      <div class="grid2">
        <figure class="card">
          <figcaption>Position error</figcaption>
          <canvas id="scopePos"></canvas>
        </figure>
        <figure class="card">
          <figcaption>Attitude error</figcaption>
          <canvas id="scopeAtt"></canvas>
        </figure>
      </div>
      <div class="grid2">
        <figure class="card">
          <figcaption>Peak coil current</figcaption>
          <canvas id="scopeCur"></canvas>
        </figure>
        <figure class="card">
          <figcaption>Copper loss</figcaption>
          <canvas id="scopePow"></canvas>
        </figure>
      </div>
    </section>

    <!-- ============================ ABOUT ============================= -->
    <section class="tabpane" id="pane-about">
      <div class="card prose" id="aboutBody"></div>
    </section>
  </main>
</div>

<script type="module" src="src/app.js"></script>
</body>
</html>
